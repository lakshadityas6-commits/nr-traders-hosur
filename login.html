<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN LOGIN - NR TRADERS</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-card {
            max-width: 400px;
            margin: 80px auto;
            padding: 40px 30px;
            background: #ffffff;
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.03);
            text-align: center;
        }
        .login-card h2 { font-size: 24px; font-weight: 800; margin-bottom: 8px; color: #1e293b; }
        .login-subtitle { font-size: 14px; color: #64748b; margin-bottom: 30px; }
        .error-msg { color: #ef4444; font-size: 13px; font-weight: 600; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Admin Management</h2>
        <div class="login-subtitle">Secure Dashboard Authentication</div>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group" style="text-align: left; margin-bottom: 20px;">
                <label style="font-weight:700; font-size:13px; color:#475569;">Security Passcode</label>
                <input type="password" id="passcode" required placeholder="••••••••" style="width:100%; padding:14px; border:1px solid #cbd5e1; border-radius:10px; margin-top:8px;">
            </div>
            <button type="submit" class="submit-btn" style="width:100%;">Access Console</button>
            <div id="error" class="error-msg">Incorrect passcode. Access Denied.</div>
        </form>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const passcode = document.getElementById('passcode').value;
            
            // SECURITY PASSCODE CHECK (Change 'admin123' to whatever you want)
            if (passcode === 'admin123') {
                localStorage.setItem('nr_admin_auth', 'true'); // Authorizes session
                window.location.href = 'dashboard.html'; // Redirects to portal page
            } else {
                document.getElementById('error').style.display = 'block';
            }
        }
    </script>
</body>
</html>
