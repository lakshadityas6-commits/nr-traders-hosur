    <script>
        const WHATSAPP_NUMBER = '919787907083';
        const CART_KEY = 'nrCart';
        let activeCategory = 'all';

        function getCart() {
            try { return JSON.parse(localStorage.getItem(CART_KEY)) || {}; }
            catch (e) { return {}; }
        }
        function saveCart(cart) {
            localStorage.setItem(CART_KEY, JSON.stringify(cart));
        }

        // Show saved quantities when the page loads
        function restoreQuantities() {
            const cart = getCart();
            document.querySelectorAll('.product-card').forEach(card => {
                const item = cart[card.dataset.name];
                card.querySelector('.qty-number').textContent = item ? item.qty : 0;
            });
            updateCartCount();
        }

        // Quantity -/+ buttons (never below 0), saved for the cart page
        function adjustQty(btn, change) {
            const card = btn.closest('.product-card');
            const key = card.dataset.name;
            const cart = getCart();
            const newQty = Math.max(0, (cart[key] ? cart[key].qty : 0) + change);

            if (newQty === 0) {
                delete cart[key];
            } else {
                cart[key] = {
                    title: card.querySelector('h3').textContent,
                    price: Number(card.dataset.price) || 0,
                    qty: newQty
                };
            }

            saveCart(cart);
            card.querySelector('.qty-number').textContent = newQty;
            updateCartCount();
        }

        // Total items shown on the cart button
        function updateCartCount() {
            const cart = getCart();
            let total = 0;
            Object.values(cart).forEach(item => total += item.qty);
            document.getElementById('cartCount').textContent = total;
        }

        // Category button
        function setCategory(btn) {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeCategory = btn.dataset.category;
            applyFilters();
        }

        // Search and category together
        function applyFilters() {
            const term = document.getElementById('productSearch').value.toLowerCase().trim();
            let visible = 0;
            document.querySelectorAll('.product-card').forEach(card => {
                const show = (activeCategory === 'all' || card.dataset.category === activeCategory)
                          && card.dataset.name.includes(term);
                card.style.display = show ? '' : 'none';
                if (show) visible++;
            });
            document.getElementById('noResults').style.display = visible === 0 ? 'block' : 'none';
        }

        restoreQuantities();
    </script>
